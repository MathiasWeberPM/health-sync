name: Garmin Sync

# Seit 23.10.2026 ueber die offizielle Garmin Connect Personal API.
# Kein Garmin-Login mehr, kein Sperrrisiko: der Key wird bei jedem Lauf
# gegen einen 24-h-Token getauscht. Key gueltig bis 21.10.2027.

on:
  schedule:
    - cron: "17 4 * * *"    # 06:17 Sommerzeit / 05:17 Winterzeit
    - cron: "47 19 * * *"   # 21:47 Sommerzeit / 20:47 Winterzeit
  workflow_dispatch:
    inputs:
      since:
        description: "Startdatum YYYY-MM-DD (leer = letzte 14 Tage)"
        required: false
        default: ""

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Synchronisieren
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          if [ -n "$SINCE" ]; then
            python garmin_sync.py --since "$SINCE"
          else
            python garmin_sync.py --days 14
          fi
